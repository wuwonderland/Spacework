name: Japan Real Estate Agent — automatic review loop

on:
  push:
    branches:
      - 'agent/research-*'
      - 'audit/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    # Do not re-trigger on commits made by this workflow itself.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEWER_MODEL: gpt-5.6-sol
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deterministic quality gate
        id: gate
        run: |
          python3 scripts/verification_gate.py > gate-result.md
          cat gate-result.md

      - name: AI adversarial review
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/ai_review.py

      - name: Write review state when API key is unavailable
        if: env.OPENAI_API_KEY == ''
        run: |
          mkdir -p verification
          cat > verification/automatic-review.md <<'EOF'
          # Automatic Review

          Status: BLOCKED — OPENAI_API_KEY is not configured in GitHub Actions.

          Deterministic validation was still executed. Configure the repository secret `OPENAI_API_KEY` to enable the independent AI adversarial review.
          EOF

      - name: Commit review artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gate-result.md verification/automatic-review.md verification/external-review.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m '[auto-review] verify research commit'
          git push

      - name: Telegram notification
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/telegram_notify.py
