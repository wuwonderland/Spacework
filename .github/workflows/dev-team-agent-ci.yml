name: FounderOS Dev Team Agent CI

on:
  push:
    branches:
      - 'founderOS/dev-team-agent-v1'
      - 'dev/*'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene
        run: |
          test ! -f .env
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'

      - name: Validate Dev Team Agent protocol
        run: |
          test -f founderOS/dev-team-agent-v1/README.md
          test -f founderOS/dev-team-agent-v1/PROTOCOL.md
          test -f founderOS/dev-team-agent-v1/tasks/TASK_TEMPLATE.md
          test -f founderOS/dev-team-agent-v1/reviews/REVIEW_TEMPLATE.md

      - name: Report
        run: |
          echo 'Dev Team Agent v1 deterministic gate passed.'
